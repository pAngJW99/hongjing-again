<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>再见，宏景｜火车站序章</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#132d31;color:#183c3a;font-family:"Microsoft YaHei",sans-serif}button{font:inherit}
    main{height:100%;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 25%,#3e7770,transparent 48%),#132d31}
    #game{position:relative;width:min(1500px,100%);aspect-ratio:1.985/1;overflow:hidden;border:5px solid #f1df9c;border-radius:18px;box-shadow:0 22px 70px #061417b8;background:url("hongjing-station.png") center/cover;image-rendering:pixelated}
    .panel{border:3px solid #6f4b26;background:#fff1bdeF;box-shadow:4px 4px 0 #2e442e8c}
    header{position:absolute;z-index:20;left:22px;right:22px;top:20px;display:flex;justify-content:space-between;pointer-events:none}
    .title{padding:9px 14px}.title small{display:block;color:#8d6030;letter-spacing:.14em}.title b{font-family:serif;font-size:clamp(20px,2.2vw,34px);letter-spacing:.08em}
    #sound{pointer-events:auto;padding:9px 13px;cursor:pointer;color:#183c3a}
    #collection{position:absolute;z-index:20;right:22px;top:92px;padding:8px 12px;display:grid;gap:5px;font-size:clamp(11px,1.1vw,15px)}#collection span{opacity:.5}#collection .yes{opacity:1;color:#a66014}
    #message{position:absolute;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);width:min(680px,calc(100% - 160px));min-height:66px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:clamp(12px,1.35vw,19px)}
    #message button,.controls button{border:2px solid #6f4b26;background:#f5ce62;color:#3f321b;padding:8px 11px;cursor:pointer}
    #hint{position:absolute;z-index:19;left:37%;bottom:25%;transform:translateX(-50%);padding:8px 14px;animation:bob 1.2s steps(2) infinite}
    #girl{position:absolute;z-index:10;left:37%;top:61.5%;width:26px;height:48px;transform:translate(-50%,-100%);transition:left 45ms linear;filter:drop-shadow(2px 3px #24412b66)}
    #girl i{position:absolute;display:block}.head{left:7px;top:3px;width:14px;height:14px;border:3px solid #3a2418;background:#e8b576;box-shadow:inset 3px 0 #6b3f24}.pony{left:1px;top:8px;width:8px;height:15px;background:#392417;box-shadow:-3px 6px #392417}.body{left:7px;top:17px;width:15px;height:18px;border:3px solid #394c3d;background:#fff1d2}.bag{left:2px;top:19px;width:8px;height:16px;border:2px solid #29472d;background:#5c943f}.legs{left:8px;top:34px;width:14px;height:12px;border-bottom:4px solid #403326;background:linear-gradient(90deg,#285676 0 42%,transparent 42% 58%,#285676 58%)}
    #star{position:absolute;z-index:9;left:58%;top:62%;transform:translate(-50%,-50%);border:0;background:transparent;color:#ffd747;font-size:clamp(25px,3vw,43px);text-shadow:0 0 3px #7d4b0b,0 0 13px #ffe27b;cursor:pointer;animation:star 1s steps(3) infinite}
    .paper{position:absolute;z-index:6;width:13px;height:9px;background:#fffbe5;box-shadow:inset 3px -2px #c9c5ad;opacity:0;animation:paper 8s linear infinite}.p1{top:36%;animation-delay:-1s}.p2{top:49%;animation-delay:-4s;animation-duration:10s}.p3{top:57%;animation-delay:-6.5s;animation-duration:7s}
    #train{position:absolute;z-index:8;left:0;top:46%;width:18%;height:33%;background:linear-gradient(#d9d5c5 0 20%,#147354 20% 75%,#283027 75%);border:4px solid #263d34;border-left:0;box-shadow:inset 0 -9px #152620,5px 4px #18302766;animation:depart 4.2s 1.4s cubic-bezier(.34,.02,.68,.37) both}
    #train:before{content:"";position:absolute;inset:29% 14% 38% 10%;background:repeating-linear-gradient(90deg,#a8d4cb 0 25px,#31534b 25px 30px);border:3px solid #e3c36b}#train:after{content:"";position:absolute;left:18%;bottom:-11px;width:28px;height:28px;border:7px solid #171d1b;border-radius:50%;background:#667069;box-shadow:100px 0 0 -7px #667069,100px 0 0 0 #171d1b}
    .controls{display:none;position:absolute;z-index:30;left:12px;right:12px;bottom:14px;justify-content:space-between;padding:7px}.controls button{min-width:68px;min-height:48px}
    @keyframes depart{0%{transform:translateX(0)}75%{opacity:1}100%{transform:translateX(-130%);opacity:0}}@keyframes paper{0%{left:-5%;transform:translateY(0) rotate(0);opacity:0}8%{opacity:.9}45%{transform:translateY(24px) rotate(180deg)}80%{opacity:.85}100%{left:105%;transform:translateY(-16px) rotate(390deg);opacity:0}}@keyframes star{50%{transform:translate(-50%,-56%) scale(1.13)}}@keyframes bob{50%{transform:translate(-50%,-5px)}}
    @media(max-width:760px){main{display:block;overflow-x:auto;overflow-y:hidden;padding:0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x}#game{width:198.5vh;min-width:860px;height:100%;aspect-ratio:auto;border:0;border-radius:0;background-size:auto 100%;scroll-snap-align:start}header{position:fixed;inset:12px 12px auto}#collection{position:fixed;right:12px;top:76px}#message{position:fixed;left:12px;bottom:82px;transform:none;width:calc(100vw - 24px)}#hint{position:fixed;left:50%;bottom:160px}.controls{position:fixed;display:flex;left:12px;right:12px;bottom:14px}#girl{top:62%}}
  </style>
</head>
<body>
<main><section id="game" aria-label="宏景火车站互动场景">
  <div id="train"></div><div class="paper p1"></div><div class="paper p2"></div><div class="paper p3"></div>
  <button id="star" aria-label="星形便签">★</button>
  <div id="girl"><i class="pony"></i><i class="head"></i><i class="body"></i><i class="bag"></i><i class="legs"></i></div>
  <header><div class="title panel"><small>A区 · 序章</small><b>宏景火车站</b></div><button id="sound" class="panel">环境声：关</button></header>
  <div id="collection" class="panel"><span id="stampState">○ 回到宏景</span><span id="noteState">☆ 星形便签</span></div>
  <div id="message" class="panel"><span id="messageText">按 A / D 或方向键，在站台上走一走</span><button id="look">查看 E</button></div>
  <div id="hint" class="panel">←　左右移动　→</div>
  <nav class="controls panel"><button id="left">←</button><button id="right">→</button><button id="touchLook">查看</button></nav>
</section></main>
<script>
  const stage=document.querySelector("main"),game=document.querySelector("#game"),girl=document.querySelector("#girl"),text=document.querySelector("#messageText"),star=document.querySelector("#star"),hint=document.querySelector("#hint");
  const stampState=document.querySelector("#stampState"),noteState=document.querySelector("#noteState");let x=37,note=false,stamp=false,audio=null;
  function render(){girl.style.left=x+"%";hint.hidden=true;if(!note&&Math.abs(x-58)<4.5)text.textContent="按 E 或点击“查看”，拾起发光的星形便签";else if(!stamp&&Math.abs(x-48)<4.5)text.textContent="按 E 或点击“查看”，读一读站牌";else if(x>83)text.textContent="右边的路通往宏景城区";if(matchMedia("(max-width:760px)").matches){const px=game.clientWidth*x/100,margin=stage.clientWidth*.28;if(px<stage.scrollLeft+margin||px>stage.scrollLeft+stage.clientWidth-margin)stage.scrollTo({left:Math.max(0,px-stage.clientWidth*.45),behavior:"smooth"})}}
  function move(n){x=Math.max(31,Math.min(88,x+n));render()}
  function interact(){if(!note&&Math.abs(x-58)<4.5){note=true;star.remove();noteState.textContent="★ 星形便签";noteState.className="yes";text.textContent="便签：如果不知道往哪里走，就先去有风的地方。"}else if(!stamp&&Math.abs(x-48)<4.5){stamp=true;stampState.textContent="◉ 回到宏景";stampState.className="yes";text.textContent="地点邮戳已收集：回到宏景"}else text.textContent="这里有风、蝉鸣，还有列车远去的声音。"}
  const keys=new Set();addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","a","A","d","D"].includes(e.key)){e.preventDefault();keys.add(e.key.toLowerCase())}if(["e","E","Enter"].includes(e.key))interact()});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
  let last=performance.now();function tick(now){const d=Math.min(32,now-last);last=now;if(keys.has("arrowleft")||keys.has("a"))move(-d*.012);if(keys.has("arrowright")||keys.has("d"))move(d*.012);requestAnimationFrame(tick)}requestAnimationFrame(tick);
  document.querySelector("#look").onclick=interact;document.querySelector("#touchLook").onclick=interact;document.querySelector("#left").onclick=()=>move(-1.4);document.querySelector("#right").onclick=()=>move(1.4);star.onclick=()=>{x=58;render();interact()};
  document.querySelector("#sound").onclick=function(){if(audio){audio.close();audio=null;this.textContent="环境声：关";return}audio=new AudioContext();const g=audio.createGain(),o=audio.createOscillator(),l=audio.createOscillator(),lg=audio.createGain();g.gain.value=.025;o.type="triangle";o.frequency.value=4620;l.frequency.value=11;lg.gain.value=.7;l.connect(lg).connect(g.gain);o.connect(g).connect(audio.destination);o.start();l.start();this.textContent="环境声：开"};
  addEventListener("load",()=>requestAnimationFrame(render));
</script>
</body>
</html>
