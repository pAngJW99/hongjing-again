<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>再见，宏景｜火车站序章</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#132d31;color:#183c3a;font-family:"Microsoft YaHei",sans-serif}button{font:inherit}
    main{height:100%;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 25%,#3e7770,transparent 48%),#132d31}
    #game{position:relative;width:min(1500px,100%);aspect-ratio:1.985/1;overflow:hidden;border:5px solid #f1df9c;border-radius:18px;box-shadow:0 22px 70px #061417b8;background:url("hongjing-station.png") center/cover;image-rendering:pixelated}
    .panel{border:3px solid #6f4b26;background:#fff1bdeF;box-shadow:4px 4px 0 #2e442e8c}
    header{position:absolute;z-index:20;left:22px;right:22px;top:20px;display:flex;justify-content:space-between;pointer-events:none}
    .title{padding:9px 14px}.title small{display:block;color:#8d6030;letter-spacing:.14em}.title b{font-family:serif;font-size:clamp(20px,2.2vw,34px);letter-spacing:.08em}
    #sound{pointer-events:auto;padding:9px 13px;cursor:pointer;color:#183c3a}
    #collection{position:absolute;z-index:20;right:22px;top:92px;padding:8px 12px;display:grid;gap:5px;font-size:clamp(11px,1.1vw,15px)}#collection span{opacity:.5}#collection .yes{opacity:1;color:#a66014}
    #message{position:absolute;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);width:min(680px,calc(100% - 160px));min-height:66px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:clamp(12px,1.35vw,19px)}
    #message button,.controls button{border:2px solid #6f4b26;background:#f5ce62;color:#3f321b;padding:8px 11px;cursor:pointer}
    #hint{position:absolute;z-index:19;left:37%;bottom:25%;transform:translateX(-50%);padding:8px 14px;animation:bob 1.2s steps(2) infinite}
    #girl{position:absolute;z-index:10;left:50%;top:66%;width:62px;height:106px;transform:translate(-50%,-100%) translateZ(0);transition:none;contain:layout paint style;will-change:left,top,background-position;backface-visibility:hidden;filter:drop-shadow(2px 3px #24412b88);background:url("traveler-walk.png") no-repeat;background-size:300% 400%;background-position:calc(var(--frame,1)*50%) calc(var(--row,0)*33.333%);image-rendering:pixelated}
    #star{position:absolute;z-index:9;left:66%;top:64%;transform:translate(-50%,-50%);border:0;background:transparent;color:#ffd747;font-size:clamp(25px,3vw,43px);text-shadow:0 0 3px #7d4b0b,0 0 13px #ffe27b;cursor:pointer;animation:star 1s steps(3) infinite}
    .paper{position:absolute;z-index:6;width:13px;height:9px;background:#fffbe5;box-shadow:inset 3px -2px #c9c5ad;opacity:0;animation:paper 8s linear infinite}.p1{top:36%;animation-delay:-1s}.p2{top:49%;animation-delay:-4s;animation-duration:10s}.p3{top:57%;animation-delay:-6.5s;animation-duration:7s}
    #train{position:absolute;z-index:11;left:-29%;top:46.5%;width:60%;height:auto;aspect-ratio:1451/414;background:url("green-train.png") center/contain no-repeat;filter:drop-shadow(3px 4px #18302766);pointer-events:none}.started #train{animation:depart 4.2s 1.4s cubic-bezier(.34,.02,.68,.37) both}
    #train:before,#train:after{display:none}
    .controls{display:none;position:absolute;z-index:30;left:12px;right:12px;bottom:14px;justify-content:space-between;padding:7px}.controls button{min-width:58px;min-height:48px}
    .cover{position:absolute;z-index:50;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#10272bbd,#162e28c9),url("hongjing-station.png") center/cover}.cover[hidden]{display:none}.ticket{width:min(520px,94%);padding:clamp(28px,5vw,58px);text-align:center;border:4px solid #6f4b26;background:#fff2cbeF;box-shadow:8px 8px 0 #2f452ec7,0 0 0 7px #e5c98f;position:relative}.ticket:before,.ticket:after{content:"✦";position:absolute;color:#b58a42;font-size:22px}.ticket:before{left:18px;top:14px}.ticket:after{right:18px;bottom:14px}.eyebrow{color:#856033;letter-spacing:.26em;font-size:12px}.hero-title{margin:10px 0 2px;font:700 clamp(42px,7vw,76px)/1.05 serif;letter-spacing:.14em;color:#173a30;text-shadow:2px 2px #e7c77f}.subtitle{margin:0 0 30px;letter-spacing:.28em;color:#724e2b}.stamp-button{width:100%;border:3px solid #29452f;background:#385d3d;color:#fff4cf;box-shadow:4px 4px 0 #1b3020;padding:15px 20px;cursor:pointer;font-weight:700;font-size:18px;letter-spacing:.16em}.stamp-button:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #1b3020}.route{margin-top:24px;color:#8d6030;font-size:13px;letter-spacing:.1em}.form-ticket{max-width:570px;text-align:left}.form-ticket h2{text-align:center;margin:0 0 22px;color:#193c31;letter-spacing:.12em}.field-label{display:block;font-weight:700;margin:16px 0 7px;color:#253a2c}.name-input{width:100%;border:2px solid #9d7748;background:#fff8df;padding:12px;font:inherit;color:#173a30;outline:none}.age-row{display:flex;align-items:center;justify-content:center;gap:14px;border-top:1px dashed #b18a57;border-bottom:1px dashed #b18a57;padding:14px 0}.age-row button{width:42px;height:38px;border:2px solid #7f5c35;background:#f3dfaa;color:#234431;font-size:20px;cursor:pointer}.age-row b{font-size:28px;min-width:48px;text-align:center}.avatar-choice{border:3px solid #436c48;background:#fdf2cc;padding:8px;text-align:center;margin:8px 0 24px;box-shadow:inset 0 0 0 3px #d7bd7e}.avatar{width:72px;height:104px;margin:auto;background:url("traveler-walk.png") no-repeat;background-size:300% 400%;background-position:50% 100%;image-rendering:pixelated}.avatar-choice span{display:block;color:#31553a;font-weight:700}.traveler-tag{font:700 14px serif;color:#704823}.identity{display:block;color:#8d6030;font-size:12px;margin-top:4px}
    @keyframes depart{0%{transform:translateX(0)}75%{opacity:1}100%{transform:translateX(-130%);opacity:0}}@keyframes paper{0%{left:-5%;transform:translateY(0) rotate(0);opacity:0}8%{opacity:.9}45%{transform:translateY(24px) rotate(180deg)}80%{opacity:.85}100%{left:105%;transform:translateY(-16px) rotate(390deg);opacity:0}}@keyframes star{50%{transform:translate(-50%,-56%) scale(1.13)}}@keyframes bob{50%{transform:translate(-50%,-5px)}}
    @media(max-width:760px){main{display:block;overflow-x:auto;overflow-y:hidden;padding:0;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x}#game{width:198.5vh;min-width:860px;height:100%;aspect-ratio:auto;border:0;border-radius:0;background-size:auto 100%;scroll-snap-align:start}header{position:fixed;inset:12px 12px auto}#collection{position:fixed;right:12px;top:76px}#message{position:fixed;left:12px;bottom:82px;transform:none;width:calc(100vw - 24px)}#hint{position:fixed;left:50%;bottom:160px}.controls{position:fixed;display:flex;left:12px;right:12px;bottom:14px}#girl{width:56px;height:96px}.cover{position:fixed;width:100vw;min-width:0}.ticket{max-width:430px;padding:28px 24px}.hero-title{font-size:42px}.form-ticket{max-height:94vh;overflow:auto}}
  </style>
</head>
<body>
<main><section id="game" aria-label="宏景火车站互动场景">
  <section id="arrival" class="cover" aria-label="再见宏景">
    <div class="ticket"><div class="eyebrow">A JOURNEY BEGINS</div><h1 class="hero-title">再见，宏景</h1><p class="subtitle">HONG JING · AGAIN</p><button id="enterJourney" class="stamp-button">踏 上 站 台　→</button><p class="route">第一站　/　宏景火车站</p></div>
  </section>
  <section id="passport" class="cover" aria-label="创建新旅人" hidden>
    <div class="ticket form-ticket"><div class="eyebrow" style="text-align:center">TRAVELER'S REGISTER</div><h2>创建新旅人</h2><label class="field-label" for="travelerInput">姓名</label><input id="travelerInput" class="name-input" maxlength="12" placeholder="请输入你的姓名"><label class="field-label">年龄</label><div class="age-row"><button id="ageDown" aria-label="年龄减一">‹</button><b id="ageValue">18</b><span>岁</span><button id="ageUp" aria-label="年龄加一">›</button></div><label class="field-label">旅人形象</label><div class="avatar-choice"><div class="avatar"></div><span>背包旅人</span></div><button id="startJourney" class="stamp-button">启 程 出 发　→</button></div>
  </section>
  <div id="train"></div><div class="paper p1"></div><div class="paper p2"></div><div class="paper p3"></div>
  <button id="star" aria-label="星形便签">★</button>
  <div id="girl" aria-label="背着绿色背包的游客"></div>
  <header><div class="title panel"><small>A区 · 序章</small><b>宏景火车站</b></div><button id="sound" class="panel">环境音：关</button></header>
  <div id="collection" class="panel"><b class="traveler-tag" id="travelerName">旅人</b><span class="identity" id="travelerAge">18 岁 · 宏景火车站</span><span id="stampState">○ 回到宏景</span><span id="noteState">☆ 星形便签</span></div>
  <div id="message" class="panel"><span id="messageText">按方向键或 WASD，在站台上走一走</span><button id="look">查看 E</button></div>
  <div id="hint" class="panel">←　探索整座站台　→</div>
  <nav class="controls panel"><button id="left" aria-label="向左走">←</button><button id="up" aria-label="向上走">↑</button><button id="touchLook">查看</button><button id="down" aria-label="向下走">↓</button><button id="right" aria-label="向右走">→</button></nav>
</section></main>
<script>
  const stage=document.querySelector("main"),game=document.querySelector("#game"),girl=document.querySelector("#girl"),text=document.querySelector("#messageText"),star=document.querySelector("#star"),hint=document.querySelector("#hint");
  const stampState=document.querySelector("#stampState"),noteState=document.querySelector("#noteState"),spriteRows={back:0,left:1,right:2,front:3},arrival=document.querySelector("#arrival"),passport=document.querySelector("#passport"),travelerInput=document.querySelector("#travelerInput"),travelerName=document.querySelector("#travelerName"),travelerAgeLabel=document.querySelector("#travelerAge"),ageValue=document.querySelector("#ageValue");let x=50,y=68,note=false,stamp=false,audio=null,pianoTimer=null,facing="front",frame=1,playing=false,travelerAge=18;
  function render(){girl.style.left=x+"%";girl.style.top=y+"%";girl.style.setProperty("--row",spriteRows[facing]);girl.style.setProperty("--frame",frame);hint.hidden=true;if(!note&&Math.abs(x-66)<4.5&&Math.abs(y-64)<7)text.textContent="按 E 或点击“查看”，拾起发光的星形便签";else if(!stamp&&Math.abs(x-49)<4.5&&Math.abs(y-64)<7)text.textContent="按 E 或点击“查看”，读一读站牌";else if(x<18)text.textContent="左边的旧站房和候车区，也可以慢慢走过去看看。";else if(x>84)text.textContent="右边的路通往宏景城区";if(matchMedia("(max-width:760px)").matches){const px=game.clientWidth*x/100,margin=stage.clientWidth*.28;if(px<stage.scrollLeft+margin||px>stage.scrollLeft+stage.clientWidth-margin)stage.scrollLeft=Math.max(0,px-stage.clientWidth*.45)}}
  function move(dx,dy){if(dx<0)facing="left";else if(dx>0)facing="right";else if(dy<0)facing="back";else if(dy>0)facing="front";x=Math.max(5,Math.min(94,x+dx));y=Math.max(52,Math.min(72,y+dy));render()}
  function interact(){if(!note&&Math.abs(x-66)<4.5&&Math.abs(y-64)<7){note=true;star.remove();noteState.textContent="★ 星形便签";noteState.className="yes";text.textContent="便签：如果不知道往哪里走，就先去有风的地方。"}else if(!stamp&&Math.abs(x-49)<4.5&&Math.abs(y-64)<7){stamp=true;stampState.textContent="◉ 回到宏景";stampState.className="yes";text.textContent="地点邮戳已收集：回到宏景"}else text.textContent="这里有风、阳光，还有列车远去的声音。"}
  const keys=new Set();addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","a","A","d","D","w","W","s","S"].includes(e.key)){e.preventDefault();keys.add(e.key.toLowerCase())}if(["e","E","Enter"].includes(e.key))interact()});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
  let last=performance.now();function tick(now){const d=Math.min(32,now-last);last=now;let dx=0,dy=0;if(keys.has("arrowleft")||keys.has("a"))dx=-d*.012;if(keys.has("arrowright")||keys.has("d"))dx=d*.012;if(keys.has("arrowup")||keys.has("w"))dy=-d*.012;if(keys.has("arrowdown")||keys.has("s"))dy=d*.012;if(playing&&(dx||dy)){frame=Math.floor(now/170)%3;move(dx,dy)}else if(frame!==1){frame=1;render()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
  document.querySelector("#look").onclick=interact;document.querySelector("#touchLook").onclick=interact;document.querySelector("#left").onclick=()=>move(-1.8,0);document.querySelector("#right").onclick=()=>move(1.8,0);document.querySelector("#up").onclick=()=>move(0,-1.5);document.querySelector("#down").onclick=()=>move(0,1.5);star.onclick=()=>{x=66;y=64;render();interact()};
  function showAge(){ageValue.textContent=travelerAge}document.querySelector("#enterJourney").onclick=()=>{arrival.hidden=true;passport.hidden=false;travelerInput.focus()};document.querySelector("#ageDown").onclick=()=>{travelerAge=Math.max(16,travelerAge-1);showAge()};document.querySelector("#ageUp").onclick=()=>{travelerAge=Math.min(99,travelerAge+1);showAge()};document.querySelector("#startJourney").onclick=()=>{const name=travelerInput.value.trim()||"旅人";travelerName.textContent=name;travelerAgeLabel.textContent=travelerAge+" 岁 · 宏景火车站";localStorage.setItem("hongjing-traveler",JSON.stringify({name,age:travelerAge}));passport.hidden=true;game.classList.add("started");playing=true;render()};
  function softNote(freq,when,length,volume,type="triangle"){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(volume,when+.035);g.gain.exponentialRampToValueAtTime(.0001,when+length);o.connect(g).connect(audio.ambience);o.start(when);o.stop(when+length+.08)}
  function playAmbientPhrase(){const start=audio.currentTime+.08,notes=[[523.25,0],[659.25,.48],[783.99,.96],[659.25,1.44],[440,2],[523.25,2.48],[659.25,2.96],[523.25,3.44],[349.23,4],[440,4.48],[523.25,4.96],[659.25,5.44],[392,6],[493.88,6.48],[587.33,6.96],[698.46,7.44]],pads=[[[261.63,329.63,392],0],[[220,261.63,329.63],2],[[174.61,220,261.63],4],[[196,246.94,293.66],6]];notes.forEach(([freq,offset])=>softNote(freq,start+offset,.85,.035));pads.forEach(([chord,offset])=>chord.forEach(freq=>softNote(freq,start+offset,2.35,.008,"sine")))}
  document.querySelector("#sound").onclick=function(){if(audio){clearInterval(pianoTimer);audio.close();audio=null;this.textContent="环境音：关";return}audio=new AudioContext();const master=audio.createGain(),delay=audio.createDelay(),feedback=audio.createGain();master.gain.value=.88;delay.delayTime.value=.31;feedback.gain.value=.16;master.connect(audio.destination);master.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(audio.destination);audio.ambience=master;playAmbientPhrase();pianoTimer=setInterval(playAmbientPhrase,8000);this.textContent="环境音：开"};
  addEventListener("load",()=>requestAnimationFrame(render));
</script>
</body>
</html>
